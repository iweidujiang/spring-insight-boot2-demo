spring:
  application:
    name: boot2-demo-consumer
  insight:
    # ---- Boot2 Agent 本地联调：全部打开 ----
    enabled: true
    server-url: http://localhost:9966
    ingest-token: change-me
    http-tracing-enabled: true
    # 跨服务 W3C traceparent（RestTemplate /call-rt）；与线程池 context-propagation-enabled 独立
    http-trace-propagation-enabled: true
    micrometer-enabled: true
    diagnostic-logs: true

server:
  port: 18090

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}

demo:
  # url 直连无需改 hosts；拓扑 remoteService 优先取 @FeignClient 的 name
  provider-url: http://127.0.0.1:18091
